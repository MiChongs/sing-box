name: xiaobaf14g release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (不含 v 前缀, 例如 1.14.0-alpha.14-xiaobaf14g.1)'
        required: true
        type: string
      prerelease:
        description: '标记为 prerelease'
        required: false
        type: boolean
        default: true
      skip_android:
        description: '跳过 Android 构建'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# 同一 tag 重 push / 多次 workflow_dispatch 时，自动取消前一次仍在跑的运行。
# 避免两次构建把 Release assets 互相覆盖，也省 Actions 用量。
#
# 注意不用 github.ref 本身，因为 tag 被删后重建 ref_name 相同，但我们要
# 把 delete-then-recreate 视为独立 run（不互相取消）。所以加 run_id 维度
# 的唯一性：push event 的 ref_name，workflow_dispatch 的 inputs.version。
concurrency:
  group: xiaobaf14g-release-${{ github.event_name == 'push' && github.ref_name || inputs.version }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25'
  # `-s -w` strip 符号表，`-buildid=` 固定 build id 便于复现构建；
  # `-checklinkname=0` 允许 sing-box 依赖的 badlinkname 跨包符号链接；
  # `-X internal/godebug.defaultGODEBUG=multipathtcp=0` 关闭 Go 1.22+ 默认
  # MPTCP 尝试（某些内核/NAT 兼容性差）。
  COMMON_LDFLAGS: "-s -w -X internal/godebug.defaultGODEBUG=multipathtcp=0 -checklinkname=0 -buildid="

jobs:
  # ───────────────────────────────────────────────────────────────────
  # 1) 解析触发源 + 决定版本 / prerelease / 是否跳过 Android
  #    轻量 job（~15s 启动 + 解析），输出供下游 matrix 和 publish 共用
  # ───────────────────────────────────────────────────────────────────
  prepare:
    name: prepare metadata
    runs-on: ubuntu-latest
    outputs:
      version:      ${{ steps.meta.outputs.version }}
      tag:          ${{ steps.meta.outputs.tag }}
      prerelease:   ${{ steps.meta.outputs.prerelease }}
      skip_android: ${{ steps.meta.outputs.skip_android }}
    steps:
      - name: Parse trigger
        id: meta
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION='${{ inputs.version }}'
            TAG="v${VERSION}"
            PRE='${{ inputs.prerelease }}'
            SKIP_ANDROID='${{ inputs.skip_android }}'
          else
            TAG='${{ github.ref_name }}'
            VERSION="${TAG#v}"
            if [[ "$VERSION" == *"-"* ]]; then
              PRE=true
            else
              PRE=false
            fi
            SKIP_ANDROID=false
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "prerelease=$PRE"
            echo "skip_android=$SKIP_ANDROID"
          } | tee -a "$GITHUB_OUTPUT"

  # ───────────────────────────────────────────────────────────────────
  # 2) Desktop 多平台并行编译 (16 个 target)
  #    默认 CGO_ENABLED=0; linux-amd64-v3-glibc 例外: CGO=1 + GOAMD64=v3
  #    走宿主 glibc 动态链接, 提供给现代 CPU + 较新 Linux 发行版用户的
  #    优化版 (AVX/AVX2/BMI/FMA 加速 wireguard / quic-go / utls 加密路径)。
  #    tag 集合与 build-all.bat 完全一致。
  #
  #    缓存策略（预期 2nd run 总时间从 ~12min 降到 ~4min）:
  #    - Go toolchain: setup-go 自带 per-OS 缓存
  #    - Go module cache (~/go/pkg/mod): key by go.sum, 所有 target 共享
  #    - Go build cache (~/.cache/go-build): key by go.sum + target 三元组
  #      (GOOS+GOARCH+后缀)，确保交叉编译产物不互相污染
  # ───────────────────────────────────────────────────────────────────
  desktop:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.suffix }}
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - { goos: windows, goarch: amd64,    ext: .exe, tags_src: windows, suffix: '' }
          - { goos: windows, goarch: arm64,    ext: .exe, tags_src: windows, suffix: '' }
          - { goos: windows, goarch: '386',    ext: .exe, tags_src: windows, suffix: '' }
          # Linux
          - { goos: linux,   goarch: amd64,    ext: '',   tags_src: others,  suffix: '' }
          # AMD64 v3 + glibc — CGO=1 動態鏈接宿主 glibc, GOAMD64=v3 啟用
          # AVX / AVX2 / BMI1 / BMI2 / FMA / F16C 指令。產物只能跑在 Haswell
          # (Intel 2013+) / Excavator (AMD 2015+) 之後的 CPU。對應的 glibc
          # 最低版本 = ubuntu-latest 上的 glibc (當前 2.39, 即 ≥ Ubuntu 24.04
          # / Debian 13 / RHEL 10 / 同代 musl 不可用)。
          - { goos: linux,   goarch: amd64,    ext: '',   tags_src: others,  suffix: -v3-glibc, goamd64: v3, cgo: '1' }
          - { goos: linux,   goarch: arm64,    ext: '',   tags_src: others,  suffix: '' }
          # ARM64 + musl — CGO=1 交叉到 aarch64-linux-musl，-extldflags=-static
          # 链出完全静态产物（无 glibc/musl 动态依赖）。适合 Alpine /
          # OpenWrt / 容器 / 嵌入式这种"宿主 libc 不可用"或小体积场景。
          # 使用 zig 作为 CC —— zig cc -target aarch64-linux-musl 自带
          # musl headers + libc.a，不需要维护 musl-cross 工具链。
          - { goos: linux,   goarch: arm64,    ext: '',   tags_src: others,  suffix: -musl, cgo: '1', cc_target: aarch64-linux-musl }
          - { goos: linux,   goarch: '386',    ext: '',   tags_src: others,  suffix: '' }
          - { goos: linux,   goarch: arm,      ext: '',   tags_src: others,  suffix: -v7,  goarm: '7' }
          - { goos: linux,   goarch: mipsle,   ext: '',   tags_src: others,  suffix: -softfloat, gomips: softfloat }
          - { goos: linux,   goarch: mips64le, ext: '',   tags_src: others,  suffix: -softfloat, gomips: softfloat }
          - { goos: linux,   goarch: riscv64,  ext: '',   tags_src: others,  suffix: '' }
          - { goos: linux,   goarch: loong64,  ext: '',   tags_src: others,  suffix: '' }
          # macOS
          - { goos: darwin,  goarch: amd64,    ext: '',   tags_src: others,  suffix: '' }
          - { goos: darwin,  goarch: arm64,    ext: '',   tags_src: others,  suffix: '' }
          # FreeBSD (drop with_tailscale — sing-box/tailscale fork 在 freebsd 有构建问题)
          - { goos: freebsd, goarch: amd64,    ext: '',   tags_src: freebsd, suffix: '' }
          - { goos: freebsd, goarch: arm64,    ext: '',   tags_src: freebsd, suffix: '' }
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # setup-go@v6 的 `cache: true` 默认开，会自动缓存 ~/go/pkg/mod，
      # key 基于 go.sum，所有 job 共享命中。go toolchain 本身也在
      # per-OS runner 上有内置缓存。
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true
          cache-dependency-path: go.sum

      # 独立的 build cache（~/.cache/go-build）。key 精确到 target 三元组
      # 以免 linux/amd64 的 .a 污染 windows/arm64 的链接。
      # restore-keys 前缀匹配：同一 target 不同 go.sum 版本能拿上次增量。
      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
          key: go-build-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}-${{ env.GO_VERSION }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-build-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}-${{ env.GO_VERSION }}-
            go-build-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}-

      # Zig is installed ONLY for targets that need a musl cross CC
      # (currently: linux/arm64-musl). Zig ships musl headers + libc.a
      # for every arch, which lets us do `zig cc -target ...` without
      # maintaining a separate musl-cross toolchain. Other targets
      # skip this step, keeping the matrix runtime unchanged.
      # mlugg/setup-zig@v2 自带 cache，重复 run 从 ~70MB 下载降到 ~1s。
      - name: Setup Zig (musl cross CC)
        if: matrix.cc_target
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0

      - name: Resolve build tags
        id: tags
        run: |
          set -euo pipefail
          case "${{ matrix.tags_src }}" in
            windows)
              # NOTE: with_naive_outbound 被有意省略——它依赖 cronet-go 预编译的 C 库，
              # 只在 CGO_ENABLED=1 + 目标平台交叉工具链齐备时才能链接成功。
              # 这里走纯 Go 跨编译路径（CGO=0），因此和 build-all.bat 保持一致：不带 naive。
              TAGS='with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_ccm,with_ocm,with_cloudflared,with_purego,with_xhttp,badlinkname,tfogo_checklinkname0'
              ;;
            freebsd)
              # drop with_tailscale: sing-box/tailscale fork 有 wgengine/router/osrouter 编译错误
              TAGS='with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_ccm,with_ocm,with_cloudflared,with_xhttp,badlinkname,tfogo_checklinkname0'
              ;;
            others)
              TAGS='with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_ccm,with_ocm,with_cloudflared,with_xhttp,badlinkname,tfogo_checklinkname0'
              ;;
          esac
          echo "tags=$TAGS" | tee -a "$GITHUB_OUTPUT"

      - name: Build binary
        env:
          # Defaults to CGO=0 static; matrix.cgo override flips to dynamic
          # for the linux-amd64-v3-glibc target.
          CGO_ENABLED: ${{ matrix.cgo || '0' }}
          GOOS:        ${{ matrix.goos }}
          GOARCH:      ${{ matrix.goarch }}
          GOARM:       ${{ matrix.goarm }}
          GOMIPS:      ${{ matrix.gomips }}
          GOAMD64:     ${{ matrix.goamd64 }}
          # cc_target, when set, drives cross-CGO via `zig cc -target`.
          # Currently: linux/arm64-musl. Empty for every other row.
          CC_TARGET:   ${{ matrix.cc_target }}
        run: |
          set -euo pipefail
          VERSION='${{ needs.prepare.outputs.version }}'
          NAME="sing-box-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}"
          BIN="${NAME}${{ matrix.ext }}"
          # Cross-CGO via zig. Musl static builds need THREE things:
          #   1. CC/CXX pointing at zig cc -target <triple> so C
          #      headers + libc.a come from zig's musl bundle
          #   2. -linkmode=external — Go's internal linker doesn't
          #      know how to emit musl-compatible dynsym entries;
          #      leaving it on produces errors like
          #      "runtime.gcdata: missing Go type information for
          #       global symbol .dynsym" and floods of unresolved
          #      getgrgid_r / getaddrinfo / malloc relocations
          #      because the internal linker tries to do static
          #      static merging itself instead of deferring to $CC
          #   3. -extldflags=-static — tells the now-external zig
          #      linker to emit a fully-static ELF (no dynamic
          #      dependencies). Only effective when linkmode=external.
          EXTRA_LDFLAGS=""
          if [ -n "${CC_TARGET}" ]; then
            export CC="zig cc -target ${CC_TARGET}"
            export CXX="zig c++ -target ${CC_TARGET}"
            EXTRA_LDFLAGS=" -linkmode=external -extldflags=-static"
            echo "Cross CGO via zig: CC='${CC}' (external linkmode, static)"
          fi
          echo "::group::Build $BIN"
          echo "tags=${{ steps.tags.outputs.tags }}"
          echo "CGO=${CGO_ENABLED} GOAMD64=${GOAMD64:-default} CC_TARGET=${CC_TARGET:-none}"
          # -trimpath: 消除构建机本地路径，可复现构建
          # -buildvcs=false: 不嵌入 git commit（我们用 -X Version 显式注入）
          # -p 0: Go 默认 GOMAXPROCS；runner 2-core 时为 2
          go build -trimpath -buildvcs=false \
            -tags "${{ steps.tags.outputs.tags }}" \
            -ldflags "${COMMON_LDFLAGS} -X github.com/sagernet/sing-box/constant.Version=${VERSION}${EXTRA_LDFLAGS}" \
            -o "$BIN" ./cmd/sing-box
          echo "::endgroup::"
          ls -lh "$BIN"
          # For glibc dynamic builds, surface the runtime ELF requirements
          # so the release notes can list the minimum supported distro.
          # For musl static builds, verify NO dynamic dependencies — if
          # something slipped in, fail the build loudly.
          if [ "${CGO_ENABLED}" = "1" ]; then
            echo "--- ELF dynamic dependencies ---"
            DEPS=$(objdump -p "$BIN" | grep -E '(NEEDED|GLIBC_)' | sort -u || true)
            echo "${DEPS}"
            if [ -n "${CC_TARGET}" ]; then
              if echo "${DEPS}" | grep -q "NEEDED"; then
                echo "ERROR: musl build has dynamic NEEDED deps — expected fully static"
                exit 1
              fi
              echo "musl static build OK — no dynamic deps"
            fi
          fi
          echo "BIN=$BIN"   >> "$GITHUB_ENV"
          echo "NAME=$NAME" >> "$GITHUB_ENV"

      # pigz 替代 gzip：并行压缩，ubuntu-latest runner 2-core 上比单核
      # gzip 快 ~1.7x。同时保留 -9 最高压缩率。
      - name: Pack with tar.gz (pigz parallel)
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends pigz >/dev/null 2>&1 || \
            { command -v pigz || (echo "pigz not available, falling back to gzip" && sudo ln -sf /bin/gzip /usr/local/bin/pigz); }
          tar cf - "${BIN}" | pigz -9 > "${NAME}.tar.gz"
          ls -lh "${NAME}.tar.gz"

      # compression-level: 0 禁用 upload-artifact 内置二次压缩（tar.gz 已压）。
      # 跳过 sha256sum 生成：publish job 统一做 manifest。
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: desktop-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}
          path: sing-box-*.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # ───────────────────────────────────────────────────────────────────
  # 3) Android arm64-v8a (CGO + NDK，走 cmd/internal/build_libbox 入口)
  #    continue-on-error 让 Android 失败不阻塞 desktop 的发布。
  #    NDK 缓存：setup-ndk 默认不缓存 ~1GB 的 NDK，手工加 cache。
  # ───────────────────────────────────────────────────────────────────
  android:
    name: android/arm64-v8a
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.skip_android != 'true'
    continue-on-error: true
    env:
      NDK_VERSION: r28c
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true
          cache-dependency-path: go.sum

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
          key: go-build-android-arm64-${{ env.GO_VERSION }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-build-android-arm64-${{ env.GO_VERSION }}-
            go-build-android-arm64-

      # NDK ~1GB 每次下载需 3min。之前尝试 actions/cache + cp -a 副本的方案
      # 失败：NDK 的 aarch64-linux-android24-clang 是 shell wrapper，内部用
      # `dirname $0`/clang 引用邻近的 clang binary；clang 本身又是指向
      # `/opt/hostedtoolcache/ndk/r28c/.../clang-19` 的软链。cp -a 或
      # actions/cache 保存时会把软链的 target 固化成绝对路径，恢复到新 runner
      # 后 /opt/hostedtoolcache 是空的，wrapper 找不到 clang → 构建失败:
      #   /home/runner/ndk-r28c/.../aarch64-linux-android24-clang: line 4:
      #   /home/runner/ndk-r28c/.../clang: No such file or directory
      #
      # 结论：NDK 不缓存，接受每次 3min 下载开销换取稳定。setup-ndk@v1 的
      # local-cache:true 仍然开着，单个 runner 连续跑同一 workflow 时它可能
      # 自行复用（但跨 runner 不共享）。
      - name: Setup NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          # r28+ (LLVM 19+) 必需 —— 旧版 libcronet.a 用 R_AARCH64_AUTH_ABS64
          # (relocation type 315, arm64e PAC pointer-authentication 扩展)，
          # NDK r27 及更早的 lld 17 不认识这个 reloc 会报:
          #   "unknown relocation (315) against symbol typeinfo for ..."
          # 影响所有 cronet 依赖的符号：__cxxabiv1 / std::bad_* / libunwind.
          # r28c (2025-10, LLVM 19) 原生支持；后续 NDK (r29+) 保持向后兼容。
          #
          # 不开 local-cache / add-to-path —— local-cache: true 会把 NDK
          # 拷到 ~/.setup-ndk/<ver>/，复制过程会把 toolchain 里 clang →
          # clang-19 的软链 target 固化成绝对路径，二次 run 时 wrapper
          # 脚本找不到 clang binary 构建失败。upstream build.yml 原始配置
          # 也只用默认路径 /opt/hostedtoolcache/ndk/... 不走 local-cache，
          # 与此保持一致，NDK 解压在 runner tool cache 区而不是 home。
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Verify NDK toolchain (sanity check)
        run: |
          set -euo pipefail
          NDK_BIN="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "ndk-path=${{ steps.ndk.outputs.ndk-path }}"
          echo "--- NDK bin layout (clang 链路) ---"
          ls -la "$NDK_BIN/aarch64-linux-android24-clang" "$NDK_BIN/clang"* 2>&1 | head -15
          # wrapper 脚本应该能找到真实的 clang binary
          "$NDK_BIN/aarch64-linux-android24-clang" --version || {
            echo "::error::NDK clang wrapper cannot resolve its target clang binary"
            echo "--- wrapper content ---"
            cat "$NDK_BIN/aarch64-linux-android24-clang"
            echo "--- clang symlink target ---"
            readlink -f "$NDK_BIN/clang" || echo "clang missing"
            exit 1
          }
          echo "ANDROID_NDK_HOME=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Build via build_libbox
        run: |
          set -euo pipefail
          VERSION='${{ needs.prepare.outputs.version }}'
          echo "::group::build_libbox android/arm64"
          go run ./cmd/internal/build_libbox -target android-bin -platform android/arm64
          echo "::endgroup::"
          ls -lh sing-box-android-arm64-v8a
          # NDK strip 减体积（约 -30%）
          STRIP="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          if [ -x "$STRIP" ]; then
            "$STRIP" --strip-all sing-box-android-arm64-v8a || true
            ls -lh sing-box-android-arm64-v8a
          fi
          NAME="sing-box-${VERSION}-android-arm64-v8a"
          # 归档内用无后缀名字（build-all.bat 同行为）
          cp sing-box-android-arm64-v8a sing-box
          tar cf - sing-box | pigz -9 > "${NAME}.tar.gz"
          ls -lh "${NAME}.tar.gz"
          rm -f sing-box sing-box-android-arm64-v8a

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: android-arm64-v8a
          path: sing-box-*.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # ───────────────────────────────────────────────────────────────────
  # 4) 收集所有 artifact + 生成 changelog + 创建 / 更新 Release
  #    android 失败或被跳过时只要 desktop 成功就发布。
  # ───────────────────────────────────────────────────────────────────
  publish:
    name: publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - desktop
      - android
    if: always() && needs.desktop.result == 'success'
    steps:
      - name: Checkout (全量历史用于 changelog)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: builds/
          merge-multiple: true

      - name: Inspect artifacts + 生成 SHA256 清单
        run: |
          set -euo pipefail
          cd builds
          ls -lh
          echo "---"
          echo "total: $(ls | wc -l) artifact(s)"
          # SHA256SUMS 供用户校验；写在 builds/ 里随 Release 一起发布。
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Build changelog
        run: |
          set -euo pipefail
          TAG='${{ needs.prepare.outputs.tag }}'
          # 找到上一个 tag (按创建时间降序)，跳过正在发布的 TAG 本身
          PREV=$(git tag --sort=-creatordate | grep -v -F -x "$TAG" | head -n1 || true)
          {
            if [ -n "$PREV" ]; then
              echo "## Changes since \`$PREV\`"
              echo ""
              git log --no-merges --pretty='- %s (`%h`)' "${PREV}..HEAD" | head -n 100
            else
              echo "## Initial xiaobaf14g release"
              echo ""
              git log --no-merges --pretty='- %s (`%h`)' HEAD | head -n 30
            fi
            echo ""
            echo "## Artifacts"
            echo ""
            for f in builds/*.tar.gz; do
              [ -e "$f" ] || continue
              SIZE=$(du -h "$f" | cut -f1)
              echo "- \`$(basename "$f")\` — ${SIZE}"
            done
            echo ""
            echo "<details><summary>SHA256SUMS</summary>"
            echo ""
            echo '```'
            cat builds/SHA256SUMS
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "## Android"
            echo ""
            if [ '${{ needs.prepare.outputs.skip_android }}' = 'true' ]; then
              echo "_Skipped (manually disabled via workflow input)._"
            elif [ '${{ needs.android.result }}' = 'success' ]; then
              echo "Built successfully."
            else
              echo "_Build failed — see [Actions run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details._"
            fi
          } > CHANGELOG_RELEASE.md
          echo "--- CHANGELOG_RELEASE.md ---"
          cat CHANGELOG_RELEASE.md

      # 幂等发布：先删除任何已存在的同 tag Release（连同所有 assets）。
      # softprops/action-gh-release 默认只"新增/更新" assets，不会清掉旧的同名
      # 产物。如果上一次构建产生了坏的二进制后我们 re-push 了 tag，旧二进制会
      # 和新二进制混在一起供用户下载 — 明确删除再重建，防止残留。
      # 注意：只删 Release（包括它挂载的 assets），不删 tag 本身 —— tag 已在
      # trigger 时被 GitHub 创建，softprops 会在下一步重新关联。
      #
      # 用 gh api 直接列所有 release（包括 draft）按 tag_name 过滤删除。
      # gh release view/list 默认不返回 draft，softprops 又会把 draft release
      # 当 "already_exists" 报错，所以必须走 api 层保证草稿也被清掉。
      - name: Delete existing Release (idempotent, handles draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG:      ${{ needs.prepare.outputs.tag }}
          REPO:     ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Looking for any Release (draft or published) with tag=$TAG"
          # List returns up to 100 releases including drafts when using the raw
          # API endpoint; filter client-side by tag_name. Use jq to extract IDs.
          IDS=$(gh api "repos/${REPO}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" || true)
          if [ -z "$IDS" ]; then
            echo "No existing Release for $TAG, nothing to delete."
          else
            for id in $IDS; do
              echo "::notice::Deleting Release id=$id (tag=$TAG)"
              gh api -X DELETE "repos/${REPO}/releases/$id"
            done
          fi

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ needs.prepare.outputs.tag }}
          name:       sing-box xiaobaf14g ${{ needs.prepare.outputs.tag }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          draft:      false
          body_path:  CHANGELOG_RELEASE.md
          files: |
            builds/*.tar.gz
            builds/SHA256SUMS
          fail_on_unmatched_files: true
