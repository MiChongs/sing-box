name: xiaobaf14g release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (不含 v 前缀, 例如 1.14.0-alpha.14-xiaobaf14g.1)'
        required: true
        type: string
      prerelease:
        description: '标记为 prerelease'
        required: false
        type: boolean
        default: true
      skip_android:
        description: '跳过 Android 构建'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ───────────────────────────────────────────────────────────────────
  # 1) 解析触发源 + 决定版本 / prerelease / 是否跳过 Android
  # ───────────────────────────────────────────────────────────────────
  prepare:
    name: prepare metadata
    runs-on: ubuntu-latest
    outputs:
      version:      ${{ steps.meta.outputs.version }}
      tag:          ${{ steps.meta.outputs.tag }}
      prerelease:   ${{ steps.meta.outputs.prerelease }}
      skip_android: ${{ steps.meta.outputs.skip_android }}
    steps:
      - name: Parse trigger
        id: meta
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION='${{ inputs.version }}'
            TAG="v${VERSION}"
            PRE='${{ inputs.prerelease }}'
            SKIP_ANDROID='${{ inputs.skip_android }}'
          else
            TAG='${{ github.ref_name }}'
            VERSION="${TAG#v}"
            if [[ "$VERSION" == *"-"* ]]; then
              PRE=true
            else
              PRE=false
            fi
            SKIP_ANDROID=false
          fi
          echo "version=$VERSION"       | tee -a "$GITHUB_OUTPUT"
          echo "tag=$TAG"               | tee -a "$GITHUB_OUTPUT"
          echo "prerelease=$PRE"        | tee -a "$GITHUB_OUTPUT"
          echo "skip_android=$SKIP_ANDROID" | tee -a "$GITHUB_OUTPUT"

  # ───────────────────────────────────────────────────────────────────
  # 2) Desktop 多平台并行编译 (16 个 target)
  #    默认 CGO_ENABLED=0; linux-amd64-v3-glibc 例外: CGO=1 + GOAMD64=v3
  #    走宿主 glibc 动态链接, 提供给现代 CPU + 较新 Linux 发行版用户的
  #    优化版 (AVX/AVX2/BMI/FMA 加速 wireguard / quic-go / utls 加密路径)。
  #    tag 集合与 build-all.bat 完全一致。
  # ───────────────────────────────────────────────────────────────────
  desktop:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.suffix }}
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - { goos: windows, goarch: amd64,    ext: .exe, tags_src: windows, suffix: '' }
          - { goos: windows, goarch: arm64,    ext: .exe, tags_src: windows, suffix: '' }
          - { goos: windows, goarch: '386',    ext: .exe, tags_src: windows, suffix: '' }
          # Linux
          - { goos: linux,   goarch: amd64,    ext: '',   tags_src: others,  suffix: '' }
          # AMD64 v3 + glibc — CGO=1 動態鏈接宿主 glibc, GOAMD64=v3 啟用
          # AVX / AVX2 / BMI1 / BMI2 / FMA / F16C 指令。產物只能跑在 Haswell
          # (Intel 2013+) / Excavator (AMD 2015+) 之後的 CPU。對應的 glibc
          # 最低版本 = ubuntu-latest 上的 glibc (當前 2.39, 即 ≥ Ubuntu 24.04
          # / Debian 13 / RHEL 10 / 同代 musl 不可用)。
          - { goos: linux,   goarch: amd64,    ext: '',   tags_src: others,  suffix: -v3-glibc, goamd64: v3, cgo: '1' }
          - { goos: linux,   goarch: arm64,    ext: '',   tags_src: others,  suffix: '' }
          # ARM64 + musl — CGO=1 交叉到 aarch64-linux-musl，-extldflags=-static
          # 链出完全静态产物（无 glibc/musl 动态依赖）。适合 Alpine /
          # OpenWrt / 容器 / 嵌入式这种"宿主 libc 不可用"或小体积场景。
          # 使用 zig 作为 CC —— zig cc -target aarch64-linux-musl 自带
          # musl headers + libc.a，不需要维护 musl-cross 工具链。
          - { goos: linux,   goarch: arm64,    ext: '',   tags_src: others,  suffix: -musl, cgo: '1', cc_target: aarch64-linux-musl }
          - { goos: linux,   goarch: '386',    ext: '',   tags_src: others,  suffix: '' }
          - { goos: linux,   goarch: arm,      ext: '',   tags_src: others,  suffix: -v7,  goarm: '7' }
          - { goos: linux,   goarch: mipsle,   ext: '',   tags_src: others,  suffix: -softfloat, gomips: softfloat }
          - { goos: linux,   goarch: mips64le, ext: '',   tags_src: others,  suffix: -softfloat, gomips: softfloat }
          - { goos: linux,   goarch: riscv64,  ext: '',   tags_src: others,  suffix: '' }
          - { goos: linux,   goarch: loong64,  ext: '',   tags_src: others,  suffix: '' }
          # macOS
          - { goos: darwin,  goarch: amd64,    ext: '',   tags_src: others,  suffix: '' }
          - { goos: darwin,  goarch: arm64,    ext: '',   tags_src: others,  suffix: '' }
          # FreeBSD (drop with_tailscale — sing-box/tailscale fork 在 freebsd 有构建问题)
          - { goos: freebsd, goarch: amd64,    ext: '',   tags_src: freebsd, suffix: '' }
          - { goos: freebsd, goarch: arm64,    ext: '',   tags_src: freebsd, suffix: '' }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      # Zig is installed ONLY for targets that need a musl cross CC
      # (currently: linux/arm64-musl). Zig ships musl headers + libc.a
      # for every arch, which lets us do `zig cc -target ...` without
      # maintaining a separate musl-cross toolchain. Other targets
      # skip this step, keeping the matrix runtime unchanged.
      - name: Setup Zig (musl cross CC)
        if: matrix.cc_target
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0

      - name: Resolve build tags
        id: tags
        run: |
          set -euo pipefail
          case "${{ matrix.tags_src }}" in
            windows)
              # NOTE: with_naive_outbound 被有意省略——它依赖 cronet-go 预编译的 C 库，
              # 只在 CGO_ENABLED=1 + 目标平台交叉工具链齐备时才能链接成功。
              # 这里走纯 Go 跨编译路径（CGO=0），因此和 build-all.bat 保持一致：不带 naive。
              TAGS='with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_ccm,with_ocm,with_cloudflared,with_purego,badlinkname,tfogo_checklinkname0'
              ;;
            freebsd)
              # drop with_tailscale: sing-box/tailscale fork 有 wgengine/router/osrouter 编译错误
              TAGS='with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_ccm,with_ocm,with_cloudflared,badlinkname,tfogo_checklinkname0'
              ;;
            others)
              TAGS='with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_ccm,with_ocm,with_cloudflared,badlinkname,tfogo_checklinkname0'
              ;;
          esac
          echo "tags=$TAGS" | tee -a "$GITHUB_OUTPUT"

      - name: Build binary
        env:
          # Defaults to CGO=0 static; matrix.cgo override flips to dynamic
          # for the linux-amd64-v3-glibc target.
          CGO_ENABLED: ${{ matrix.cgo || '0' }}
          GOOS:        ${{ matrix.goos }}
          GOARCH:      ${{ matrix.goarch }}
          GOARM:       ${{ matrix.goarm }}
          GOMIPS:      ${{ matrix.gomips }}
          GOAMD64:     ${{ matrix.goamd64 }}
          # cc_target, when set, drives cross-CGO via `zig cc -target`.
          # Currently: linux/arm64-musl. Empty for every other row.
          CC_TARGET:   ${{ matrix.cc_target }}
        run: |
          set -euo pipefail
          VERSION='${{ needs.prepare.outputs.version }}'
          NAME="sing-box-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}"
          BIN="${NAME}${{ matrix.ext }}"
          # Cross-CGO via zig. For -musl targets we also pass
          # -extldflags=-static so the final ELF has zero runtime libc
          # dependency — this is the whole point of shipping a musl
          # build (Alpine/OpenWrt/scratch containers can run it
          # directly without adding glibc).
          EXTRA_LDFLAGS=""
          if [ -n "${CC_TARGET}" ]; then
            export CC="zig cc -target ${CC_TARGET}"
            export CXX="zig c++ -target ${CC_TARGET}"
            EXTRA_LDFLAGS=" -extldflags=-static"
            echo "Cross CGO via zig: CC='${CC}'"
          fi
          echo "Building $BIN (tags=${{ steps.tags.outputs.tags }}, CGO=${CGO_ENABLED}, GOAMD64=${GOAMD64:-default}, CC_TARGET=${CC_TARGET:-none})"
          go build -v -trimpath -buildvcs=false \
            -tags "${{ steps.tags.outputs.tags }}" \
            -ldflags "-s -w -X github.com/sagernet/sing-box/constant.Version=${VERSION} -X internal/godebug.defaultGODEBUG=multipathtcp=0 -checklinkname=0 -buildid=${EXTRA_LDFLAGS}" \
            -o "$BIN" ./cmd/sing-box
          ls -lh "$BIN"
          # For glibc dynamic builds, surface the runtime ELF requirements
          # so the release notes can list the minimum supported distro.
          # For musl static builds, verify NO dynamic dependencies — if
          # something slipped in, fail the build loudly.
          if [ "${CGO_ENABLED}" = "1" ]; then
            echo "--- ELF dynamic dependencies ---"
            DEPS=$(objdump -p "$BIN" | grep -E '(NEEDED|GLIBC_)' | sort -u || true)
            echo "${DEPS}"
            if [ -n "${CC_TARGET}" ]; then
              if echo "${DEPS}" | grep -q "NEEDED"; then
                echo "ERROR: musl build has dynamic NEEDED deps — expected fully static"
                exit 1
              fi
              echo "musl static build OK — no dynamic deps"
            fi
          fi
          echo "BIN=$BIN"   >> "$GITHUB_ENV"
          echo "NAME=$NAME" >> "$GITHUB_ENV"

      - name: Pack with tar.gz
        run: |
          set -euo pipefail
          # gzip -9 最大压缩；bin 只有一个文件不需要 solid. tar 保留
          # Unix 权限 (775) 方便 Linux/BSD 用户直接 tar xzf && ./sing-box.
          tar czf "${NAME}.tar.gz" "${BIN}"
          ls -lh "${NAME}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}
          path: sing-box-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────
  # 3) Android arm64-v8a (CGO + NDK，走 cmd/internal/build_libbox 入口)
  #    continue-on-error 让 Android 失败不阻塞 desktop 的发布。
  # ───────────────────────────────────────────────────────────────────
  android:
    name: android/arm64-v8a
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.skip_android != 'true'
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: Setup NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          # r28+ (LLVM 19+) 必需 —— 旧版 libcronet.a 用 R_AARCH64_AUTH_ABS64
          # (relocation type 315, arm64e PAC pointer-authentication 扩展)，
          # NDK r27 及更早的 lld 17 不认识这个 reloc 会报:
          #   "unknown relocation (315) against symbol typeinfo for ..."
          # 影响所有 cronet 依赖的符号：__cxxabiv1 / std::bad_* / libunwind.
          # r28c (2025-10, LLVM 19) 原生支持；后续 NDK (r29+) 保持向后兼容。
          ndk-version: r28c
          add-to-path: true


      - name: Build via build_libbox
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          VERSION='${{ needs.prepare.outputs.version }}'
          go run ./cmd/internal/build_libbox -target android-bin -platform android/arm64
          ls -lh sing-box-android-arm64-v8a
          # NDK strip 减体积（约 -30%）
          STRIP="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          if [ -x "$STRIP" ]; then
            "$STRIP" --strip-all sing-box-android-arm64-v8a || true
            ls -lh sing-box-android-arm64-v8a
          fi
          NAME="sing-box-${VERSION}-android-arm64-v8a"
          # 归档内用无后缀名字（build-all.bat 同行为）
          cp sing-box-android-arm64-v8a sing-box
          tar czf "${NAME}.tar.gz" sing-box
          ls -lh "${NAME}.tar.gz"
          rm -f sing-box sing-box-android-arm64-v8a

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-v8a
          path: sing-box-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────
  # 4) 收集所有 artifact + 生成 changelog + 创建 / 更新 Release
  #    android 失败或被跳过时只要 desktop 成功就发布。
  # ───────────────────────────────────────────────────────────────────
  publish:
    name: publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - desktop
      - android
    if: always() && needs.desktop.result == 'success'
    steps:
      - name: Checkout (全量历史用于 changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: builds/
          merge-multiple: true

      - name: Inspect artifacts
        run: |
          set -euo pipefail
          ls -lh builds/
          echo "---"
          echo "total artifacts: $(ls builds/ | wc -l)"

      - name: Build changelog
        run: |
          set -euo pipefail
          TAG='${{ needs.prepare.outputs.tag }}'
          # 找到上一个 tag (按创建时间降序)，跳过正在发布的 TAG 本身
          PREV=$(git tag --sort=-creatordate | grep -v -F -x "$TAG" | head -n1 || true)
          {
            if [ -n "$PREV" ]; then
              echo "## Changes since \`$PREV\`"
              echo ""
              git log --no-merges --pretty='- %s (`%h`)' "${PREV}..HEAD" | head -n 100
            else
              echo "## Initial xiaobaf14g release"
              echo ""
              git log --no-merges --pretty='- %s (`%h`)' HEAD | head -n 30
            fi
            echo ""
            echo "## Artifacts"
            echo ""
            for f in builds/*.tar.gz; do
              [ -e "$f" ] || continue
              SIZE=$(du -h "$f" | cut -f1)
              echo "- \`$(basename "$f")\` — ${SIZE}"
            done
            echo ""
            echo "## Android"
            echo ""
            if [ '${{ needs.prepare.outputs.skip_android }}' = 'true' ]; then
              echo "_Skipped (manually disabled via workflow input)._"
            elif [ '${{ needs.android.result }}' = 'success' ]; then
              echo "Built successfully."
            else
              echo "_Build failed — see [Actions run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details._"
            fi
          } > CHANGELOG_RELEASE.md
          echo "--- CHANGELOG_RELEASE.md ---"
          cat CHANGELOG_RELEASE.md

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ needs.prepare.outputs.tag }}
          name:       sing-box xiaobaf14g ${{ needs.prepare.outputs.tag }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          draft:      false
          body_path:  CHANGELOG_RELEASE.md
          files:      builds/*.tar.gz
          fail_on_unmatched_files: true
