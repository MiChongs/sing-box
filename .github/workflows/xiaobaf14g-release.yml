name: xiaobaf14g release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (不含 v 前缀, 例如 1.15.0-alpha.10-xiaobaf14g.1)'
        required: true
        type: string
      prerelease:
        description: '标记为 prerelease'
        required: false
        type: boolean
        default: true
      skip_android:
        description: '跳过 Android 构建'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# 同一 tag 重 push / 多次 workflow_dispatch 时，自动取消前一次仍在跑的运行。
# 避免两次构建把 Release assets 互相覆盖，也省 Actions 用量。
#
# 注意不用 github.ref 本身，因为 tag 被删后重建 ref_name 相同，但我们要
# 把 delete-then-recreate 视为独立 run（不互相取消）。所以加 run_id 维度
# 的唯一性：push event 的 ref_name，workflow_dispatch 的 inputs.version。
concurrency:
  group: xiaobaf14g-release-${{ github.event_name == 'push' && github.ref_name || inputs.version }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27.1'
  # 预装 NDK 没有 r28+ 时才下载这个版本。
  NDK_VERSION: r28c

# 缓存布局（全部由 actions/cache 显式管理，setup-go 自带缓存关闭）:
# - Go 模块 (~/go/pkg/mod): prepare 按每个 target 的 tag 组合 `go list -deps`
#   预热，只下载真正用到的模块（cronet 全平台预编译库合计 3GB+，不能整体
#   go mod download），key 绑定 go.sum + 构建 tag 文件，其余 job 只恢复不保存。
# - Go 构建缓存 (~/.cache/go-build): 每个 target 一份，key 带 commit sha，
#   restore-keys 前缀回退到上一次发布的缓存，每次发布都增量编译并写回。
#   同一 target 的普通版与 -ebpf 版在同一 job 里先后编译，-ebpf 版复用
#   普通版编译出的几乎全部包。实验性构建有自己的 key，没有命中时回退到
#   同一 target 普通版的缓存。
# - Go toolchain / Zig: setup-go、setup-zig 自带 runner tool cache。
# - NDK: 优先用 runner 预装的 r28+，没有才下载。

jobs:
  # ───────────────────────────────────────────────────────────────────
  # 1) 解析触发源 + 决定版本 / prerelease / 是否跳过 Android，
  #    并预热 Go 模块缓存供后续所有 job 恢复
  # ───────────────────────────────────────────────────────────────────
  prepare:
    name: prepare metadata + modules
    runs-on: ubuntu-latest
    outputs:
      version:      ${{ steps.meta.outputs.version }}
      tag:          ${{ steps.meta.outputs.tag }}
      prerelease:   ${{ steps.meta.outputs.prerelease }}
      skip_android: ${{ steps.meta.outputs.skip_android }}
      gomod_key:    ${{ steps.gomod_key.outputs.key }}
    steps:
      - name: Parse trigger
        id: meta
        env:
          EVENT:         ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRE:     ${{ inputs.prerelease }}
          INPUT_SKIP:    ${{ inputs.skip_android }}
          REF_NAME:      ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            VERSION="${INPUT_VERSION#v}"
            TAG="v${VERSION}"
            PRE="$INPUT_PRE"
            SKIP_ANDROID="$INPUT_SKIP"
          else
            TAG="$REF_NAME"
            VERSION="${TAG#v}"
            # 版本号本身带 -xiaobaf14g.N 后缀，不能按 "含 -" 判断；
            # 只有 alpha / beta / rc 才是 prerelease。
            if [[ "$VERSION" =~ -(alpha|beta|rc) ]]; then
              PRE=true
            else
              PRE=false
            fi
            SKIP_ANDROID=false
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "prerelease=$PRE"
            echo "skip_android=$SKIP_ANDROID"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Compute module cache key
        id: gomod_key
        run: echo "key=gomod-${{ hashFiles('go.sum', 'release/DEFAULT_BUILD_TAGS*') }}" | tee -a "$GITHUB_OUTPUT"

      - name: Look up Go module cache
        id: gomod
        uses: actions/cache/restore@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ steps.gomod_key.outputs.key }}
          lookup-only: true

      - name: Setup Go
        if: steps.gomod.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      # 对每个 target 的 GOOS/GOARCH/CGO/tag 组合跑一次 go list -deps，
      # 下载的模块集合正好是所有 job 编译时需要的。
      - name: Download modules for every target
        if: steps.gomod.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          drop() { tr ',' '\n' | grep -vx -e "$1" | paste -sd, -; }
          OTHERS=$(cat release/DEFAULT_BUILD_TAGS_OTHERS)
          WINDOWS=$(drop with_naive_outbound < release/DEFAULT_BUILD_TAGS_WINDOWS)
          list() {
            echo "go list $*"
            env "$@" go list -deps -tags "$TAGS" ./cmd/sing-box > /dev/null
          }
          TAGS="${OTHERS},with_ebpf"
          for target in linux/amd64 linux/arm64 linux/386 linux/arm linux/mipsle linux/mips64le linux/riscv64 linux/loong64; do
            list GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0
          done
          list GOOS=linux GOARCH=amd64 CGO_ENABLED=1
          list GOOS=linux GOARCH=arm64 CGO_ENABLED=1
          TAGS="$OTHERS"
          for target in darwin/amd64 darwin/arm64 freebsd/amd64 freebsd/arm64; do
            list GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0
          done
          TAGS="$WINDOWS"
          for target in windows/amd64 windows/arm64 windows/386; do
            list GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0
          done
          TAGS="${OTHERS},with_easytier"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            list GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0
          done
          TAGS="${WINDOWS},with_easytier"
          for target in windows/amd64 windows/arm64; do
            list GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0
          done
          TAGS="${OTHERS},with_naive_outbound,with_xhttp,netgo,with_ebpf"
          list GOOS=android GOARCH=arm64 CGO_ENABLED=1
          TAGS="${OTHERS},with_naive_outbound,with_xhttp,netgo,with_easytier"
          list GOOS=android GOARCH=arm64 CGO_ENABLED=1
          go list -deps ./cmd/internal/build_libbox > /dev/null
          du -sh ~/go/pkg/mod

      - name: Save Go module cache
        if: steps.gomod.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ steps.gomod_key.outputs.key }}

  # ───────────────────────────────────────────────────────────────────
  # 2) Desktop 多平台并行编译
  #    tag 集合取自 release/DEFAULT_BUILD_TAGS_*（随上游同步）；这里的
  #    target 不链接 cronet，去掉 with_naive_outbound。
  #    ebpf: true 的 target 额外编译带 with_ebpf 的 -ebpf 版本，与普通版
  #    并列发布。
  #    默认 CGO_ENABLED=0；linux-amd64-v3-glibc 走 CGO=1 动态链接宿主
  #    glibc（ubuntu-latest 的 glibc 版本即最低要求）；linux-arm64-musl
  #    用 zig cc 交叉到 aarch64-linux-musl 并完全静态链接。
  # ───────────────────────────────────────────────────────────────────
  desktop:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.suffix }}${{ matrix.ebpf && ' (+ebpf)' || '' }}
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - { goos: windows, goarch: amd64,    ext: .exe, tags_src: windows, suffix: '' }
          # AMD64 v3 — Haswell+ (Intel 2013+) / Excavator+ (AMD 2015+)。启用 AVX/AVX2/BMI1/BMI2/F16C/FMA/LZCNT/MOVBE。
          - { goos: windows, goarch: amd64,    ext: .exe, tags_src: windows, suffix: -v3,  goamd64: v3 }
          # AMD64 v4 — Skylake-X+ (Intel 2017+) / Zen 4+ (AMD 2022+)。在 v3 之上启用 AVX-512，老 CPU 会 SIGILL。
          - { goos: windows, goarch: amd64,    ext: .exe, tags_src: windows, suffix: -v4,  goamd64: v4 }
          - { goos: windows, goarch: arm64,    ext: .exe, tags_src: windows, suffix: '' }
          - { goos: windows, goarch: '386',    ext: .exe, tags_src: windows, suffix: '' }
          # Linux（每个 target 同时出普通版与 -ebpf 版）
          - { goos: linux,   goarch: amd64,    ext: '',   tags_src: others,  suffix: '',          ebpf: true }
          - { goos: linux,   goarch: amd64,    ext: '',   tags_src: others,  suffix: -v3-glibc,   ebpf: true, goamd64: v3, cgo: '1' }
          - { goos: linux,   goarch: arm64,    ext: '',   tags_src: others,  suffix: '',          ebpf: true }
          - { goos: linux,   goarch: arm64,    ext: '',   tags_src: others,  suffix: -musl,       ebpf: true, cgo: '1', cc_target: aarch64-linux-musl }
          - { goos: linux,   goarch: '386',    ext: '',   tags_src: others,  suffix: '',          ebpf: true }
          - { goos: linux,   goarch: arm,      ext: '',   tags_src: others,  suffix: -v7,         ebpf: true, goarm: '7' }
          - { goos: linux,   goarch: mipsle,   ext: '',   tags_src: others,  suffix: -softfloat,  ebpf: true, gomips: softfloat }
          - { goos: linux,   goarch: mips64le, ext: '',   tags_src: others,  suffix: -softfloat,  ebpf: true, gomips: softfloat }
          - { goos: linux,   goarch: riscv64,  ext: '',   tags_src: others,  suffix: '',          ebpf: true }
          - { goos: linux,   goarch: loong64,  ext: '',   tags_src: others,  suffix: '',          ebpf: true }
          # macOS
          - { goos: darwin,  goarch: amd64,    ext: '',   tags_src: others,  suffix: '' }
          - { goos: darwin,  goarch: arm64,    ext: '',   tags_src: others,  suffix: '' }
          # FreeBSD
          - { goos: freebsd, goarch: amd64,    ext: '',   tags_src: others,  suffix: '' }
          - { goos: freebsd, goarch: arm64,    ext: '',   tags_src: others,  suffix: '' }
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Restore Go modules
        uses: actions/cache/restore@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ needs.prepare.outputs.gomod_key }}

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: gobuild-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}-${{ env.GO_VERSION }}-${{ github.sha }}
          restore-keys: |
            gobuild-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}-${{ env.GO_VERSION }}-

      # Zig 只给需要 musl 交叉 CC 的 target 装，setup-zig 自带缓存。
      - name: Setup Zig (musl cross CC)
        if: matrix.cc_target
        uses: mlugg/setup-zig@v2

      - name: Build binaries
        env:
          CGO_ENABLED: ${{ matrix.cgo || '0' }}
          GOOS:        ${{ matrix.goos }}
          GOARCH:      ${{ matrix.goarch }}
          GOARM:       ${{ matrix.goarm }}
          GOMIPS:      ${{ matrix.gomips }}
          GOMIPS64:    ${{ matrix.gomips }}
          GOAMD64:     ${{ matrix.goamd64 }}
          CC_TARGET:   ${{ matrix.cc_target }}
          TAGS_SRC:    ${{ matrix.tags_src }}
          EBPF:        ${{ matrix.ebpf }}
          SUFFIX:      ${{ matrix.suffix }}
          EXT:         ${{ matrix.ext }}
          VERSION:     ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          case "$TAGS_SRC" in
            windows) BASE_TAGS=$(cat release/DEFAULT_BUILD_TAGS_WINDOWS) ;;
            *)       BASE_TAGS=$(cat release/DEFAULT_BUILD_TAGS_OTHERS) ;;
          esac
          BASE_TAGS=$(echo "$BASE_TAGS" | tr ',' '\n' | grep -vx 'with_naive_outbound' | paste -sd, -)
          # release/LDFLAGS 随上游同步（godebug 默认值、checklinkname 等）。
          LDFLAGS="-s -w -buildid= $(cat release/LDFLAGS) -X github.com/sagernet/sing-box/constant.Version=${VERSION}"
          # Musl 静态构建：zig cc 提供 musl headers + libc.a；Go 内部链接器
          # 不支持 musl 静态合并，需 -linkmode=external -extldflags=-static。
          if [ -n "${CC_TARGET}" ]; then
            export CC="zig cc -target ${CC_TARGET}"
            export CXX="zig c++ -target ${CC_TARGET}"
            LDFLAGS="${LDFLAGS} -linkmode=external -extldflags=-static"
          fi
          VARIANTS=("")
          if [ "$EBPF" = "true" ]; then
            VARIANTS+=("-ebpf")
          fi
          mkdir -p dist
          for VARIANT in "${VARIANTS[@]}"; do
            TAGS="$BASE_TAGS"
            if [ "$VARIANT" = "-ebpf" ]; then
              TAGS="${TAGS},with_ebpf"
            fi
            NAME="sing-box-${VERSION}-${GOOS}-${GOARCH}${SUFFIX}${VARIANT}"
            BIN="${NAME}${EXT}"
            echo "::group::Build $BIN"
            echo "tags=${TAGS}"
            echo "ldflags=${LDFLAGS}"
            echo "CGO=${CGO_ENABLED} GOAMD64=${GOAMD64:-default} CC_TARGET=${CC_TARGET:-none}"
            go build -trimpath -buildvcs=false -tags "$TAGS" -ldflags "$LDFLAGS" -o "dist/$BIN" ./cmd/sing-box
            echo "::endgroup::"
            ls -lh "dist/$BIN"
            # glibc 动态构建列出运行时 ELF 依赖；musl 静态构建确认无动态依赖。
            if [ "${CGO_ENABLED}" = "1" ]; then
              DEPS=$(objdump -p "dist/$BIN" | grep -E '(NEEDED|GLIBC_)' | sort -u || true)
              echo "--- ELF dynamic dependencies ---"
              echo "${DEPS}"
              if [ -n "${CC_TARGET}" ] && echo "${DEPS}" | grep -q "NEEDED"; then
                echo "::error::musl build has dynamic NEEDED deps — expected fully static"
                exit 1
              fi
            fi
          done

      # pigz 并行压缩，保留 -9 最高压缩率；归档内文件名与产物同名。
      - name: Pack with tar.gz
        run: |
          set -euo pipefail
          command -v pigz >/dev/null || sudo apt-get install -y --no-install-recommends pigz >/dev/null
          cd dist
          for BIN in sing-box-*; do
            tar cf - "$BIN" | pigz -9 > "${BIN%.exe}.tar.gz"
            rm -f "$BIN"
          done
          ls -lh

      # compression-level: 0 禁用 upload-artifact 内置二次压缩（tar.gz 已压）。
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: desktop-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # ───────────────────────────────────────────────────────────────────
  # 3) 实验性构建：在普通版 tag 集合上加实验性功能 tag，产物带对应后缀，
  #    与正式产物并列发布。continue-on-error 让实验性构建失败不阻塞发布。
  #    - easytier: with_easytier（EasyTier endpoint，内嵌 WASM 内核约 +11MB）。
  #      wazero 只在 amd64 / arm64 上编译执行，其他架构走解释器，因此只提供
  #      amd64 / arm64。Android 的实验性构建在 android job 中，复用其 NDK 与
  #      构建缓存。
  # ───────────────────────────────────────────────────────────────────
  experimental:
    name: experimental ${{ matrix.feature }} ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: prepare
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { feature: easytier, tag: with_easytier, goos: windows, goarch: amd64, ext: .exe, tags_src: windows }
          - { feature: easytier, tag: with_easytier, goos: windows, goarch: arm64, ext: .exe, tags_src: windows }
          - { feature: easytier, tag: with_easytier, goos: linux,   goarch: amd64, ext: '',   tags_src: others }
          - { feature: easytier, tag: with_easytier, goos: linux,   goarch: arm64, ext: '',   tags_src: others }
          - { feature: easytier, tag: with_easytier, goos: darwin,  goarch: amd64, ext: '',   tags_src: others }
          - { feature: easytier, tag: with_easytier, goos: darwin,  goarch: arm64, ext: '',   tags_src: others }
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Restore Go modules
        uses: actions/cache/restore@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ needs.prepare.outputs.gomod_key }}

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: gobuild-${{ matrix.feature }}-${{ matrix.goos }}-${{ matrix.goarch }}-${{ env.GO_VERSION }}-${{ github.sha }}
          restore-keys: |
            gobuild-${{ matrix.feature }}-${{ matrix.goos }}-${{ matrix.goarch }}-${{ env.GO_VERSION }}-
            gobuild-${{ matrix.goos }}-${{ matrix.goarch }}-${{ env.GO_VERSION }}-

      - name: Build binary
        env:
          CGO_ENABLED: '0'
          GOOS:        ${{ matrix.goos }}
          GOARCH:      ${{ matrix.goarch }}
          TAGS_SRC:    ${{ matrix.tags_src }}
          FEATURE:     ${{ matrix.feature }}
          FEATURE_TAG: ${{ matrix.tag }}
          EXT:         ${{ matrix.ext }}
          VERSION:     ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          case "$TAGS_SRC" in
            windows) BASE_TAGS=$(cat release/DEFAULT_BUILD_TAGS_WINDOWS) ;;
            *)       BASE_TAGS=$(cat release/DEFAULT_BUILD_TAGS_OTHERS) ;;
          esac
          BASE_TAGS=$(echo "$BASE_TAGS" | tr ',' '\n' | grep -vx 'with_naive_outbound' | paste -sd, -)
          TAGS="${BASE_TAGS},${FEATURE_TAG}"
          LDFLAGS="-s -w -buildid= $(cat release/LDFLAGS) -X github.com/sagernet/sing-box/constant.Version=${VERSION}"
          NAME="sing-box-${VERSION}-${GOOS}-${GOARCH}-${FEATURE}"
          BIN="${NAME}${EXT}"
          mkdir -p dist
          echo "::group::Build $BIN"
          echo "tags=${TAGS}"
          echo "ldflags=${LDFLAGS}"
          go build -trimpath -buildvcs=false -tags "$TAGS" -ldflags "$LDFLAGS" -o "dist/$BIN" ./cmd/sing-box
          echo "::endgroup::"
          ls -lh "dist/$BIN"

      - name: Pack with tar.gz
        run: |
          set -euo pipefail
          command -v pigz >/dev/null || sudo apt-get install -y --no-install-recommends pigz >/dev/null
          cd dist
          for BIN in sing-box-*; do
            tar cf - "$BIN" | pigz -9 > "${BIN%.exe}.tar.gz"
            rm -f "$BIN"
          done
          ls -lh

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: experimental-${{ matrix.feature }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # ───────────────────────────────────────────────────────────────────
  # 4) Android arm64-v8a (CGO + NDK + naive，走 cmd/internal/build_libbox
  #    android-bin 入口)，普通版与 -ebpf 版在同一 job 先后编译共享构建缓存。
  #    continue-on-error 让 Android 失败不阻塞 desktop 的发布。
  #    实验性 -easytier 版在单独的 continue-on-error 步骤中编译，失败不影响
  #    普通版与 -ebpf 版，结果经 job output 写入 Release 说明。
  # ───────────────────────────────────────────────────────────────────
  android:
    name: android/arm64-v8a (+ebpf, +experimental)
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.skip_android != 'true'
    continue-on-error: true
    outputs:
      experimental: ${{ steps.experimental.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Restore Go modules
        uses: actions/cache/restore@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ needs.prepare.outputs.gomod_key }}

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: gobuild-android-arm64-${{ env.GO_VERSION }}-${{ github.sha }}
          restore-keys: |
            gobuild-android-arm64-${{ env.GO_VERSION }}-

      # r28+ (LLVM 19+) 必需 —— libcronet.a 使用 R_AARCH64_AUTH_ABS64
      # (relocation 315)，NDK r27 及更早的 lld 不认识。runner 预装了多个
      # NDK（默认 ANDROID_NDK_HOME 指向较旧版本），优先挑预装的 r28+，
      # 省掉 ~1GB 下载。NDK 不能用 actions/cache：clang wrapper 依赖的软链
      # 在保存/恢复后会被固化成绝对路径，新 runner 上找不到 clang。
      - name: Locate preinstalled NDK (r28+)
        id: ndk_local
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          NDK=""
          for dir in $(ls -d "$SDK"/ndk/*/ 2>/dev/null | sort -V -r); do
            dir="${dir%/}"
            major=$(basename "$dir" | cut -d. -f1)
            if [[ "$major" =~ ^[0-9]+$ ]] && [ "$major" -ge 28 ] && \
               [ -x "$dir/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]; then
              NDK="$dir"
              break
            fi
          done
          echo "path=$NDK" | tee -a "$GITHUB_OUTPUT"

      - name: Setup NDK (download fallback)
        id: ndk_download
        if: steps.ndk_local.outputs.path == ''
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Verify NDK toolchain
        env:
          NDK_PATH: ${{ steps.ndk_local.outputs.path || steps.ndk_download.outputs.ndk-path }}
        run: |
          set -euo pipefail
          NDK_BIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "ndk-path=$NDK_PATH"
          "$NDK_BIN/aarch64-linux-android24-clang" --version || {
            echo "::error::NDK clang wrapper cannot resolve its target clang binary"
            cat "$NDK_BIN/aarch64-linux-android24-clang"
            readlink -f "$NDK_BIN/clang" || echo "clang missing"
            exit 1
          }
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Build via build_libbox
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          command -v pigz >/dev/null || sudo apt-get install -y --no-install-recommends pigz >/dev/null
          STRIP="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          mkdir -p dist
          for VARIANT in "" "-ebpf"; do
            EXTRA_TAGS=""
            if [ "$VARIANT" = "-ebpf" ]; then
              EXTRA_TAGS="with_ebpf"
            fi
            echo "::group::build_libbox android/arm64${VARIANT}"
            go run ./cmd/internal/build_libbox -target android-bin -platform android/arm64 \
              -version "${VERSION}" -tags "${EXTRA_TAGS}"
            echo "::endgroup::"
            # NDK strip 减体积（约 -30%）
            "$STRIP" --strip-all sing-box-android-arm64-v8a
            ls -lh sing-box-android-arm64-v8a
            # 归档内用无后缀名字
            mv sing-box-android-arm64-v8a sing-box
            tar cf - sing-box | pigz -9 > "dist/sing-box-${VERSION}-android-arm64-v8a${VARIANT}.tar.gz"
            rm -f sing-box
          done
          ls -lh dist

      - name: Build experimental variants via build_libbox
        id: experimental
        continue-on-error: true
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          command -v pigz >/dev/null || sudo apt-get install -y --no-install-recommends pigz >/dev/null
          STRIP="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          for EXPERIMENT in "easytier:with_easytier"; do
            FEATURE="${EXPERIMENT%%:*}"
            FEATURE_TAG="${EXPERIMENT#*:}"
            echo "::group::build_libbox android/arm64-${FEATURE}"
            go run ./cmd/internal/build_libbox -target android-bin -platform android/arm64 \
              -version "${VERSION}" -tags "${FEATURE_TAG}"
            echo "::endgroup::"
            "$STRIP" --strip-all sing-box-android-arm64-v8a
            ls -lh sing-box-android-arm64-v8a
            mv sing-box-android-arm64-v8a sing-box
            tar cf - sing-box | pigz -9 > "dist/sing-box-${VERSION}-android-arm64-v8a-${FEATURE}.tar.gz"
            rm -f sing-box
          done
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: android-arm64-v8a
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # ───────────────────────────────────────────────────────────────────
  # 5) 收集所有 artifact + 生成 changelog + 创建 / 更新 Release
  #    android、实验性构建失败或被跳过时只要 desktop 成功就发布。
  # ───────────────────────────────────────────────────────────────────
  publish:
    name: publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - desktop
      - experimental
      - android
    if: always() && needs.desktop.result == 'success'
    steps:
      - name: Checkout (全量历史用于 changelog)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: builds/
          merge-multiple: true

      - name: Inspect artifacts + 生成 SHA256 清单
        run: |
          set -euo pipefail
          cd builds
          ls -lh
          echo "---"
          echo "total: $(ls | wc -l) artifact(s)"
          # SHA256SUMS 供用户校验；写在 builds/ 里随 Release 一起发布。
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # 引入 mikepenz/release-changelog-builder-action 做 commit 分类 + 美化；
      # 配置见 .github/changelog-config.json。它只负责 "Changes since <PREV>"
      # 那一段的美化（分类 + bullet + hash 链接），头尾元信息和 artifacts
      # 表格仍由下面的 shell 拼接。
      - name: Resolve previous tag
        id: prevtag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          # 取当前 tag 祖先链上最近的 xiaobaf14g tag。按创建时间取最新 tag 会
          # 选中同步进来的上游 tag（历史被改写、与当前 tag 无共同近祖），
          # changelog 会膨胀到数万个提交。
          PREV=$(git describe --tags --abbrev=0 --match 'v*-xiaobaf14g*' "${TAG}^" 2>/dev/null || true)
          echo "prev=$PREV" | tee -a "$GITHUB_OUTPUT"

      - name: Build categorized changelog (external)
        id: cl
        uses: mikepenz/release-changelog-builder-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          configuration: .github/changelog-config.json
          fromTag: ${{ steps.prevtag.outputs.prev }}
          toTag:   ${{ needs.prepare.outputs.tag }}
          failOnError: false
          # 写文件而不是经 env 传给下一步：changelog 很长时 env 会超过
          # 单个参数 128KB 的上限（Argument list too long）。
          outputFile: CHANGELOG_BODY.md
          mode: COMMIT
          fetchReleaseInformation: false
          commitMode: true

      - name: Assemble Release notes
        env:
          TAG:          ${{ needs.prepare.outputs.tag }}
          PREV:         ${{ steps.prevtag.outputs.prev }}
          SKIP_ANDROID: ${{ needs.prepare.outputs.skip_android }}
          ANDROID_RES:  ${{ needs.android.result }}
          EXPERIMENTAL_RES: ${{ needs.experimental.result }}
          ANDROID_EXPERIMENTAL: ${{ needs.android.outputs.experimental }}
          REPO:         ${{ github.repository }}
          SERVER_URL:   ${{ github.server_url }}
          RUN_ID:       ${{ github.run_id }}
          IS_PRE:       ${{ needs.prepare.outputs.prerelease }}
          CL_COUNT:     ${{ steps.cl.outputs.changes }}
        run: |
          set -euo pipefail
          BUILD_DATE=$(date -u +'%Y-%m-%d %H:%M UTC')

          if [ -n "$PREV" ]; then
            PREV_CELL="\`$PREV\`"
            COMPARE_URL="${SERVER_URL}/${REPO}/compare/${PREV}...${TAG}"
            RANGE_LINE="[\`$PREV\` … \`$TAG\`]($COMPARE_URL)"
          else
            PREV_CELL="(initial)"
            RANGE_LINE="(initial release)"
          fi
          if [ "$IS_PRE" = 'true' ]; then
            CHANNEL_CELL="pre-release"
          else
            CHANNEL_CELL="stable"
          fi

          {
            echo "# sing-box xiaobaf14g &mdash; \`$TAG\`"
            echo ""
            echo "> $RANGE_LINE"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Tag | \`$TAG\` |"
            echo "| Previous | $PREV_CELL |"
            echo "| Commits | ${CL_COUNT:-0} |"
            echo "| Channel | $CHANNEL_CELL |"
            echo "| Built | $BUILD_DATE |"
            echo ""
            echo "---"
            echo ""
            # GitHub Release 正文上限 125000 字符，留出头尾和 artifacts 表格的余量。
            if [ -s CHANGELOG_BODY.md ] && [ "$(wc -c < CHANGELOG_BODY.md)" -gt 90000 ]; then
              head -c 90000 CHANGELOG_BODY.md | sed '$d'
              echo ""
              echo "_… 更多提交见 ${RANGE_LINE}_"
            elif [ -s CHANGELOG_BODY.md ]; then
              cat CHANGELOG_BODY.md
            else
              echo "_No noteworthy changes in this range._"
            fi
            echo ""
            echo "---"
            echo ""
            echo "## Artifacts"
            echo ""
            echo "> 带 \`-ebpf\` 后缀的是启用 eBPF 入站 (\`with_ebpf\`) 的构建，其余功能与同平台普通版一致。"
            echo ">"
            echo "> 带 \`-easytier\` 后缀的是启用 EasyTier endpoint (\`with_easytier\`) 的**实验性**构建，仅提供 amd64 / arm64（含 Android arm64-v8a），其余功能与同平台普通版一致。"
            echo ""
            if ls builds/*.tar.gz >/dev/null 2>&1; then
              echo "| File | Size |"
              echo "|---|---:|"
              for f in builds/*.tar.gz; do
                SIZE=$(du -h "$f" | cut -f1 | tr -d ' ')
                printf '| `%s` | %s |\n' "$(basename "$f")" "$SIZE"
              done
            else
              echo "_No artifacts produced._"
            fi
            echo ""
            echo "<details><summary><b>SHA256SUMS</b></summary>"
            echo ""
            echo '```'
            cat builds/SHA256SUMS 2>/dev/null || echo '(no checksum manifest)'
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "---"
            echo ""
            echo "## Android Client"
            echo ""
            if [ "$SKIP_ANDROID" = 'true' ]; then
              echo "> Skipped — disabled via workflow input."
            elif [ "$ANDROID_RES" = 'success' ]; then
              echo "> Built successfully and attached above."
            else
              echo "> Build failed. Inspect the [Actions run](${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}) for logs."
            fi
            echo ""
            echo "---"
            echo ""
            echo "## Experimental Builds"
            echo ""
            if [ "$EXPERIMENTAL_RES" = 'success' ]; then
              echo "- Desktop: built successfully and attached above."
            else
              echo "- Desktop: some builds failed and are not attached."
            fi
            if [ "$SKIP_ANDROID" = 'true' ]; then
              echo "- Android: skipped — disabled via workflow input."
            elif [ "$ANDROID_EXPERIMENTAL" = 'success' ]; then
              echo "- Android: built successfully and attached above."
            else
              echo "- Android: build failed and is not attached."
            fi
            if [ "$EXPERIMENTAL_RES" != 'success' ] || { [ "$SKIP_ANDROID" != 'true' ] && [ "$ANDROID_EXPERIMENTAL" != 'success' ]; }; then
              echo ""
              echo "> Inspect the [Actions run](${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}) for logs."
            fi
            echo ""
            echo "---"
            echo ""
            echo "<sub>Generated by xiaobaf14g release workflow · <a href=\"${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}\">run #${RUN_ID}</a></sub>"
          } > CHANGELOG_RELEASE.md

          echo "--- CHANGELOG_RELEASE.md ---"
          cat CHANGELOG_RELEASE.md

      # 幂等发布：先删除任何已存在的同 tag Release（连同所有 assets）。
      # softprops/action-gh-release 默认只"新增/更新" assets，不会清掉旧的同名
      # 产物。如果上一次构建产生了坏的二进制后我们 re-push 了 tag，旧二进制会
      # 和新二进制混在一起供用户下载 — 明确删除再重建，防止残留。
      # 注意：只删 Release（包括它挂载的 assets），不删 tag 本身 —— tag 已在
      # trigger 时被 GitHub 创建，softprops 会在下一步重新关联。
      #
      # 用 gh api 直接列所有 release（包括 draft）按 tag_name 过滤删除。
      # gh release view/list 默认不返回 draft，softprops 又会把 draft release
      # 当 "already_exists" 报错，所以必须走 api 层保证草稿也被清掉。
      - name: Delete existing Release (idempotent, handles draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG:      ${{ needs.prepare.outputs.tag }}
          REPO:     ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Looking for any Release (draft or published) with tag=$TAG"
          # List returns up to 100 releases including drafts when using the raw
          # API endpoint; filter client-side by tag_name. Use jq to extract IDs.
          IDS=$(gh api "repos/${REPO}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" || true)
          if [ -z "$IDS" ]; then
            echo "No existing Release for $TAG, nothing to delete."
          else
            for id in $IDS; do
              echo "::notice::Deleting Release id=$id (tag=$TAG)"
              gh api -X DELETE "repos/${REPO}/releases/$id"
            done
          fi

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ needs.prepare.outputs.tag }}
          name:       sing-box xiaobaf14g ${{ needs.prepare.outputs.tag }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          draft:      false
          body_path:  CHANGELOG_RELEASE.md
          files: |
            builds/*.tar.gz
            builds/SHA256SUMS
          fail_on_unmatched_files: true
